<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想弾幕遊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a0010;
    overflow: hidden;
    touch-action: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: #fff;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    background: #2a0820;
    box-shadow: 0 0 40px rgba(200, 100, 200, 0.4);
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="700"></canvas>
</div>

<!-- ユーティリティと永続化 (依存なし) -->
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<!-- 画像アセット読み込み (script ロード時に並列で開始) -->
<script src="js/assets.js"></script>
<!-- 共有状態・定数・メインループ (canvas/ctx/state を宣言) -->
<script src="js/main.js"></script>
<!-- 入力処理 (canvas に対するイベント登録のため main.js の後) -->
<script src="js/input.js"></script>
<!-- 各機能モジュール (関数定義のみ。順序は main.js の後であれば任意) -->
<script src="js/effects.js"></script>
<script src="js/items.js"></script>
<script src="js/player.js"></script>
<script src="js/bullets.js"></script>
<script src="js/enemy.js"></script>
<script src="js/midboss.js"></script>
<script src="js/boss.js"></script>
<script src="js/stage.js"></script>
<script src="js/hud.js"></script>
<!-- 全モジュールが読み込まれた最後にゲームループ起動 -->
<script src="js/boot.js"></script>
</body>
</html>
